[package]
name = "fm8-codec"
version = "0.1.0"
edition.workspace = true

# std-only image codecs, one module per format. `image` is a dev-dependency
# only: tests encode with it and check our decoders against it.
[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "ico", "tga", "qoi", "pnm", "hdr"] }
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
