[package]
name = "filem8_view"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "filem8_view"
path = "src/lib.rs"

[[bin]]
name = "filem8_view"
path = "src/main.rs"

[features]
# Same loaders as filem8: light = images, text/code, OBJ/STL; `full` adds SVG, audio waveform, glTF, archives, WebP/AVIF.
default = ["fm8-preview/svg"]
full = ["fm8-preview/full"]

[dependencies]
fm8-ui = { path = "../fm8-ui" }
fm8-core = { path = "../fm8-core" }
fm8-preview = { path = "../fm8-preview", default-features = false }
winit = "0.30"
softbuffer = "0.4"
