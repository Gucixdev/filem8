[package]
name = "filem8"
version = "0.1.0"
edition.workspace = true

[lib]
name = "filem8"
path = "src/lib.rs"

[[bin]]
name = "filem8"
path = "src/main.rs"

[dependencies]
fm8-ui = { path = "../fm8-ui" }
fm8-core = { path = "../fm8-core" }
winit = "0.30"
wgpu = "27"
pollster = "0.4"
softbuffer = "0.4"
bytemuck = "1"
libc = "0.2"
