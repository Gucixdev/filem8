[package]
name = "fm8-preview"
version = "0.1.0"
edition.workspace = true

[features]
default = ["full"]
full = ["extra-codecs", "avif", "svg", "audio", "audio-play", "model-gltf"]
extra-codecs = ["dep:image"]
avif = ["extra-codecs", "image/avif-native"]
svg = ["dep:resvg"]
audio = ["dep:symphonia"]
audio-play = ["audio", "dep:cpal"]
model-gltf = ["dep:gltf"]

[dependencies]
fm8-core = { path = "../fm8-core" }
fm8-codec = { path = "../fm8-codec" }
image = { version = "0.25", default-features = false, features = ["jpeg", "webp"], optional = true }
resvg = { version = "0.45", default-features = false, optional = true }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "vorbis", "ogg", "wav", "pcm", "aac", "isomp4", "alac", "mkv"], optional = true }
cpal = { version = "0.15", optional = true }
gltf = { version = "1", default-features = false, features = ["import", "utils"], optional = true }
